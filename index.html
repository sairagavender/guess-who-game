<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who? - Legends Edition</title>
    <style>
        :root {
            --bg-color: #222831;
            --card-bg: #393e46;
            --accent: #00adb5;
            --text-color: #eeeeee;
            --eliminated: #b50000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        header {
            width: 100%;
            background: #1a1d24;
            padding: 15px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--accent); letter-spacing: 1px; }
        p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.7; }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 0.9rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-pick {
            background: var(--accent);
            color: white;
        }

        .btn-reset {
            background: #eeeeee;
            color: #333;
        }

        button:hover { opacity: 0.9; transform: scale(1.05); }

        /* Grid */
        .board {
            display: grid;
            /* Adaptive grid: fits as many as possible */
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            max-width: 1200px;
            width: 96%;
            padding-bottom: 60px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
            border: 2px solid transparent;
            user-select: none;
        }

        .card:hover {
            border-color: var(--accent);
            z-index: 10;
            transform: scale(1.05);
        }

        .card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4f5663;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .card .name {
            font-size: 0.75rem;
            font-weight: 600;
            display: block;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Eliminated State */
        .card.eliminated {
            opacity: 0.4;
            filter: grayscale(100%);
            background: #2a2a2a;
        }
        
        .card.eliminated img {
            opacity: 0.2;
        }

        .card.eliminated::after {
            content: "X";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: var(--eliminated);
            font-weight: bold;
            pointer-events: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            color: #222;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
            width: 80%;
        }

        .secret-img {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }
        
        .secret-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--bg-color);
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<header>
    <h1>🕵️ Guess Who: Legends</h1>
    <p>64 Famous Personalities (Avatars)</p>
</header>

<div class="controls">
    <button class="btn-reset" onclick="resetBoard()">🔄 Reset Board</button>
    <button class="btn-pick" onclick="pickSecret()">❓ Pick My Character</button>
</div>

<div class="board" id="game-board">
    </div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <h3>Your Secret Identity:</h3>
        <div class="secret-img" id="secret-img-display"></div>
        <div class="secret-name" id="secret-name-display">?</div>
        <button class="btn-pick" onclick="closeModal()" style="width:100%">CLOSE</button>
    </div>
</div>

<script>
    // 'g' is gender hint: 'm' for male styles, 'f' for female styles
    // This ensures the avatar looks roughly appropriate for the name.
    const rawData = [
        { n: "A. Lincoln", g: "m" }, { n: "Einstein", g: "m" }, { n: "M. Curie", g: "f" }, { n: "Shakespeare", g: "m" },
        { n: "Cleopatra", g: "f" }, { n: "Gandhi", g: "m" }, { n: "Da Vinci", g: "m" }, { n: "M. Monroe", g: "f" },
        { n: "Newton", g: "m" }, { n: "Earhart", g: "f" }, { n: "Elvis", g: "m" }, { n: "Beyonce", g: "f" },
        { n: "Jobs", g: "m" }, { n: "Gates", g: "m" }, { n: "Musk", g: "m" }, { n: "Zuckerberg", g: "m" },
        { n: "Oprah", g: "f" }, { n: "Obama", g: "m" }, { n: "Mandela", g: "m" }, { n: "Queen Eliz II", g: "f" },
        { n: "Picasso", g: "m" }, { n: "Van Gogh", g: "m" }, { n: "Frida Kahlo", g: "f" }, { n: "Beethoven", g: "m" },
        { n: "Mozart", g: "m" }, { n: "Darwin", g: "m" }, { n: "Turing", g: "m" }, { n: "Ada Lovelace", g: "f" },
        { n: "Messi", g: "m" }, { n: "Ronaldo", g: "m" }, { n: "Serena W.", g: "f" }, { n: "M. Jordan", g: "m" },
        { n: "Ali", g: "m" }, { n: "Usain Bolt", g: "m" }, { n: "Pele", g: "m" }, { n: "Babe Ruth", g: "m" },
        { n: "Disney", g: "m" }, { n: "Chaplin", g: "m" }, { n: "M. Jackson", g: "m" }, { n: "Madonna", g: "f" },
        { n: "T. Swift", g: "f" }, { n: "Bowie", g: "m" }, { n: "Freddie M.", g: "m" }, { n: "Bob Marley", g: "m" },
        { n: "Audrey H.", g: "f" }, { n: "Diana", g: "f" }, { n: "J.K. Rowling", g: "f" }, { n: "Hemingway", g: "m" },
        { n: "Armstrong", g: "m" }, { n: "Columbus", g: "m" }, { n: "Caesar", g: "m" }, { n: "Alexander", g: "m" },
        { n: "Napoleon", g: "m" }, { n: "Churchill", g: "m" }, { n: "MLK Jr.", g: "m" }, { n: "Rosa Parks", g: "f" },
        { n: "Mother Teresa", g: "f" }, { n: "Dalai Lama", g: "m" }, { n: "Pope Francis", g: "m" }, { n: "Edison", g: "m" },
        { n: "Tesla", g: "m" }, { n: "Galileo", g: "m" }, { n: "Hawking", g: "m" }, { n: "Franklin", g: "m" }
    ];

    // Build URLs based on gender to make visuals distinct
    const characters = rawData.map(p => {
        let styles = "";
        if(p.g === 'm') styles = "&top[]=shortHair,turban,winterHat1,winterHat02,hat&facialHairProbability=40"; 
        if(p.g === 'f') styles = "&top[]=longHair,longHairBob,longHairCurly,longHairStraight&facialHairProbability=0";
        
        return {
            name: p.n,
            img: `https://api.dicebear.com/7.x/avataaars/svg?seed=${p.n}${styles}&backgroundColor=transparent`
        };
    });

    // --- GAME LOGIC ---

    const board = document.getElementById('game-board');
    const modal = document.getElementById('modal');
    const secretName = document.getElementById('secret-name-display');
    const secretImg = document.getElementById('secret-img-display');

    function initGame() {
        board.innerHTML = '';
        characters.forEach(char => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => card.classList.toggle('eliminated');
            
            card.innerHTML = `
                <img src="${char.img}" loading="lazy" alt="avatar">
                <span class="name">${char.name}</span>
            `;
            board.appendChild(card);
        });
    }

    // Expose functions to window
    window.resetBoard = function() {
        if(confirm("Reset the whole board?")) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('eliminated'));
        }
    };

    window.pickSecret = function() {
        const r = characters[Math.floor(Math.random() * characters.length)];
        secretName.innerText = r.name;
        secretImg.innerHTML = `<img src="${r.img}" style="width:100%; border-radius:50%">`;
        modal.style.display = 'flex';
    };

    window.closeModal = function() {
        modal.style.display = 'none';
    };

    // Initialize
    initGame();

</script>

</body>
</html>
